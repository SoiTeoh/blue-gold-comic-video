<!doctype html><meta charset="utf-8"><style>body{margin:0;background:#101a2b}canvas{display:block}</style><canvas></canvas><script>
const canvas=document.querySelector('canvas');const ctx=canvas.getContext('2d');let source,hand,ink,mask,strokes=[],segments=[],W,H,cfg,lastInk=0,lastColor=0,brushPoints=[];
async function load(url){return new Promise((resolve,reject)=>{let i=new Image;i.onload=()=>resolve(i);i.onerror=()=>reject(Error('Cannot load '+url));i.src=url})}
window.init=async function(options){cfg=options;source=await load(cfg.image);hand=await load(cfg.hand);W=cfg.width;H=cfg.height||Math.round(source.height/source.width*W/2)*2;canvas.width=W;canvas.height=H;
let plate=document.createElement('canvas');plate.width=W;plate.height=H;let pc=plate.getContext('2d',{willReadFrequently:true});pc.fillStyle=cfg.paper;pc.fillRect(0,0,W,H);let fit=Math.min(W/source.width,H/source.height),sw=source.width*fit,sh=source.height*fit;pc.drawImage(source,(W-sw)/2,(H-sh)/2,sw,sh);source=plate;
// Crop the alpha hand to visible bounds, matching the original Python renderer.
let hc=document.createElement('canvas');hc.width=hand.width;hc.height=hand.height;let hctx=hc.getContext('2d',{willReadFrequently:true});hctx.drawImage(hand,0,0);let hd=hctx.getImageData(0,0,hc.width,hc.height),minx=hc.width,miny=hc.height,maxx=0,maxy=0;
for(let y=0;y<hc.height;y++)for(let x=0;x<hc.width;x++){let p=(y*hc.width+x)*4;if(hd.data[p+3]>20){minx=Math.min(minx,x);maxx=Math.max(maxx,x);miny=Math.min(miny,y);maxy=Math.max(maxy,y)}}let cropped=document.createElement('canvas');cropped.width=maxx-minx+1;cropped.height=maxy-miny+1;cropped.getContext('2d').drawImage(hc,minx,miny,cropped.width,cropped.height,0,0,cropped.width,cropped.height);hand=cropped;
let pixels=pc.getImageData(0,0,W,H).data;let lum=new Float32Array(W*H);for(let i=0;i<lum.length;i++)lum[i]=pixels[i*4]*.299+pixels[i*4+1]*.587+pixels[i*4+2]*.114;
let mag=new Float32Array(W*H),dir=new Uint8Array(W*H);
for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){let i=y*W+x,gx=-lum[i-W-1]+lum[i-W+1]-2*lum[i-1]+2*lum[i+1]-lum[i+W-1]+lum[i+W+1],gy=-lum[i-W-1]-2*lum[i-W]-lum[i-W+1]+lum[i+W-1]+2*lum[i+W]+lum[i+W+1];mag[i]=Math.hypot(gx,gy);let a=(Math.atan2(gy,gx)*180/Math.PI+180)%180;dir[i]=a<22.5||a>=157.5?0:a<67.5?1:a<112.5?2:3}
// Nonmaximum suppression avoids turning solid dark areas into ink.
let edges=new Uint8Array(W*H),offsets=[1,W+1,W,W-1];for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){let i=y*W+x,d=offsets[dir[i]];if(mag[i]>=cfg.edgeThreshold&&mag[i]>=mag[i-d]&&mag[i]>=mag[i+d])edges[i]=1}
let neighbors=[-W-1,-W,-W+1,-1,1,W-1,W,W+1];for(let seed=0;seed<edges.length;seed++){if(!edges[seed])continue;let path=[],i=seed;while(true){edges[i]=0;path.push([i%W,Math.floor(i/W)]);let next=-1;for(let d of neighbors){let j=i+d;if(j>=0&&j<edges.length&&Math.abs(j%W-i%W)<=1&&edges[j]){next=j;break}}if(next<0)break;i=next}if(path.length>=cfg.minStroke)strokes.push(path)}
// Region priority controls narrative ordering; it does not modify source colors.
const regions=cfg.regions||[{x:0,y:0,width:1,height:1}];function priority(s){let p=s[Math.floor(s.length/2)];let n=regions.findIndex(r=>p[0]>=r.x*W&&p[0]<(r.x+r.width)*W&&p[1]>=r.y*H&&p[1]<(r.y+r.height)*H);return n<0?regions.length:n}strokes.sort((a,b)=>priority(a)-priority(b)||a[0][1]-b[0][1]);
for(let path of strokes){segments.push([path[0],path[0],true]);for(let j=1;j<path.length;j++)segments.push([path[j-1],path[j],false])}
ink=document.createElement('canvas');ink.width=W;ink.height=H;mask=document.createElement('canvas');mask.width=W;mask.height=H;
const radius=cfg.brushRadius;for(let row=0;row<H+radius;row+=radius*.9){let pts=[];for(let x=-radius;x<W+radius;x+=radius*.45)pts.push([x,row]);if(Math.round(row/(radius*.9))%2)pts.reverse();brushPoints.push(...pts)}
window.meta={width:W,height:H,strokes:strokes.length,segments:segments.length,colorSteps:brushPoints.length};window.draw(0);return window.meta};
function stampHand(p){if(!p||cfg.noHand)return;let h=H*.29,w=h*hand.width/hand.height;ctx.drawImage(hand,p[0],p[1],w,h)}
window.draw=function(t){let ic=ink.getContext('2d'),mc=mask.getContext('2d');let n=Math.floor(segments.length*Math.max(0,Math.min(1,(t-cfg.lead)/cfg.inkSeconds)));let nc=Math.floor(brushPoints.length*Math.max(0,Math.min(1,(t-cfg.lead-cfg.inkSeconds)/cfg.colorSeconds)));if(n<lastInk||nc<lastColor){ic.clearRect(0,0,W,H);mc.clearRect(0,0,W,H);lastInk=lastColor=0}
ic.strokeStyle=cfg.inkColor;ic.lineWidth=cfg.lineWidth;ic.lineCap='round';for(let i=lastInk;i<n;i++){let [a,b]=segments[i];ic.beginPath();ic.moveTo(...a);ic.lineTo(...b);ic.stroke()}lastInk=n;
mc.fillStyle='white';mc.strokeStyle='white';mc.lineWidth=cfg.brushRadius*2;mc.lineCap='round';for(let i=lastColor;i<nc;i++){let p=brushPoints[i];mc.beginPath();mc.arc(...p,cfg.brushRadius,0,Math.PI*2);mc.fill();if(i&&Math.abs(p[1]-brushPoints[i-1][1])<1){mc.beginPath();mc.moveTo(...brushPoints[i-1]);mc.lineTo(...p);mc.stroke()}}lastColor=nc;
ctx.fillStyle=cfg.paper;ctx.fillRect(0,0,W,H);ctx.drawImage(ink,0,0);if(nc){let col=document.createElement('canvas');col.width=W;col.height=H;let cc=col.getContext('2d');cc.drawImage(source,0,0);if(nc<brushPoints.length){cc.globalCompositeOperation='destination-in';cc.drawImage(mask,0,0)}ctx.drawImage(col,0,0)}
let p=null;if(t>=cfg.lead&&t<cfg.lead+cfg.inkSeconds&&n){p=segments[n-1][1]}else if(t>=cfg.lead+cfg.inkSeconds&&t<cfg.lead+cfg.inkSeconds+cfg.colorSeconds&&nc){p=brushPoints[nc-1]}stampHand(p);
if(cfg.captions){let cue=cfg.captions.find(c=>t>=c.start&&t<c.end);if(cue){let font=Math.round(W*.044),bottom=H*.90;ctx.font='500 '+font+'px "Microsoft YaHei",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';let lines=[],line='';for(let ch of cue.text){if(ctx.measureText(line+ch).width>W*.86){lines.push(line);line=ch}else line+=ch}if(line)lines.push(line);let grad=ctx.createLinearGradient(0,H*.79,0,H);grad.addColorStop(0,'rgba(4,12,23,0)');grad.addColorStop(.45,'rgba(4,12,23,.78)');grad.addColorStop(1,'rgba(4,12,23,.92)');ctx.fillStyle=grad;ctx.fillRect(0,H*.79,W,H*.21);ctx.fillStyle='#fff3da';lines.forEach((line,i)=>ctx.fillText(line,W/2,bottom+(i-(lines.length-1)/2)*font*1.55));}}

};</script>
